<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.4; rx: 18; }
      .panel-soft { fill: #f2f6ff; stroke: #cad8f6; stroke-width: 1.4; rx: 18; }
      .panel-green { fill: #f0f8f4; stroke: #b9dec7; stroke-width: 1.4; rx: 18; }
      .panel-yellow { fill: #fff8e6; stroke: #ead18a; stroke-width: 1.4; rx: 18; }
      .panel-purple { fill: #f5f0ff; stroke: #d8c8fa; stroke-width: 1.4; rx: 18; }
      .title { font: 700 42px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #667085; }
      .h1 { font: 700 25px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #172033; }
      .h2 { font: 700 21px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #172033; }
      .body { font: 400 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #344054; }
      .small { font: 400 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #667085; }
      .tag { font: 700 14px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #667085; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2f6fed; stroke-width: 2.6; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 2.6; fill: none; marker-end: url(#arrow-green); }
      .pill-blue { fill: #2f6fed; }
      .pill-green { fill: #16a34a; }
      .pill-purple { fill: #7c3aed; }
      .pill-orange { fill: #ea7a1a; }
      .mono { font: 500 16px "Cascadia Mono", Consolas, monospace; fill: #344054; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1040"/>

  <text class="title" x="80" y="72">智能知识检索与问答系统架构图</text>
  <text class="subtitle" x="80" y="112">Modular RAG MCP Server · Agentic RAG · Hybrid Search · Full Observability</text>

  <rect class="panel" x="80" y="150" width="1440" height="110"/>
  <text class="h1" x="120" y="194">入口层</text>
  <rect class="pill-blue" x="120" y="212" width="120" height="30" rx="15"/>
  <text class="tag" x="147" y="232">MCP / CLI</text>
  <text class="body" x="280" y="207">Claude Desktop、命令行脚本、Streamlit Dashboard 统一接入知识库问答与数据管理能力</text>
  <text class="small" x="280" y="236">MCP JSON-RPC 2.0 / stdio transport · Dashboard multi-page UI · scripts/query.py / scripts/ingest.py</text>

  <rect class="panel-purple" x="80" y="315" width="420" height="220"/>
  <text class="h1" x="120" y="360">可观测性 Dashboard</text>
  <text class="body" x="120" y="400">系统概览 · 知识库浏览 · 文档导入</text>
  <text class="body" x="120" y="432">导入追踪 · 查询追踪 · 评估面板</text>
  <text class="body" x="120" y="464">Agent 对话 · ReAct 推理轨迹可视化</text>
  <rect class="pill-purple" x="120" y="488" width="142" height="30" rx="15"/>
  <text class="tag" x="146" y="508">Streamlit UI</text>

  <rect class="panel-soft" x="590" y="315" width="420" height="220"/>
  <text class="h1" x="630" y="360">MCP Server</text>
  <text class="body" x="630" y="400">query_knowledge_hub</text>
  <text class="body" x="630" y="432">list_collections</text>
  <text class="body" x="630" y="464">get_document_summary</text>
  <rect class="pill-blue" x="630" y="488" width="172" height="30" rx="15"/>
  <text class="tag" x="658" y="508">JSON-RPC 2.0</text>

  <rect class="panel-green" x="1100" y="315" width="420" height="220"/>
  <text class="h1" x="1140" y="360">ReAct Agent</text>
  <text class="body" x="1140" y="400">Thought / Action / Observation 主循环</text>
  <text class="body" x="1140" y="432">ToolRegistry 五类 RAG 工具</text>
  <text class="body" x="1140" y="464">ConversationMemory + SelfChecker</text>
  <rect class="pill-green" x="1140" y="488" width="138" height="30" rx="15"/>
  <text class="tag" x="1170" y="508">Agentic RAG</text>

  <rect class="panel" x="80" y="600" width="690" height="250"/>
  <text class="h1" x="120" y="645">数据摄取流水线</text>
  <text class="body" x="120" y="686">1. SHA256 完整性校验与幂等导入</text>
  <text class="body" x="120" y="718">2. PDF / TXT / MD / DOCX 加载与 Markdown 化</text>
  <text class="body" x="120" y="750">3. Recursive Splitter 智能分块</text>
  <text class="body" x="120" y="782">4. ChunkRefiner / MetadataEnricher / ImageCaptioner</text>
  <text class="body" x="120" y="814">5. Dense + Sparse 双路编码，写入向量库与 BM25 索引</text>

  <rect class="panel-yellow" x="830" y="600" width="690" height="250"/>
  <text class="h1" x="870" y="645">混合检索与回答生成</text>
  <text class="body" x="870" y="686">QueryProcessor：jieba 分词、关键词抽取、查询清洗</text>
  <text class="body" x="870" y="718">Dense Retriever：Embedding + ChromaDB 语义召回</text>
  <text class="body" x="870" y="750">Sparse Retriever：BM25 倒排索引精确召回</text>
  <text class="body" x="870" y="782">RRF Fusion：rank-based 融合，规避分数归一化问题</text>
  <text class="body" x="870" y="814">Reranker + ResponseBuilder：精排、引用与最终答案构造</text>

  <rect class="panel" x="80" y="900" width="1440" height="108"/>
  <text class="h1" x="120" y="944">可插拔 Provider 层</text>
  <text class="body" x="410" y="936">LLM：OpenAI / Azure / DeepSeek / Ollama</text>
  <text class="body" x="410" y="966">Embedding：OpenAI / Azure / Ollama / OpenAI-compatible</text>
  <text class="body" x="1060" y="936">VectorStore：ChromaDB</text>
  <text class="body" x="1060" y="966">Reranker / Splitter / Evaluator：</text>
  <text class="body" x="1060" y="990">Factory + YAML 配置切换</text>

  <line class="arrow-blue" x1="800" y1="260" x2="800" y2="315"/>
  <line class="arrow" x1="500" y1="425" x2="590" y2="425"/>
  <line class="arrow-green" x1="1010" y1="425" x2="1100" y2="425"/>
  <line class="arrow-green" x1="1310" y1="535" x2="1310" y2="600"/>
  <line class="arrow-blue" x1="425" y1="535" x2="425" y2="600"/>
  <line class="arrow" x1="770" y1="725" x2="830" y2="725"/>
  <line class="arrow" x1="425" y1="850" x2="425" y2="900"/>
  <line class="arrow" x1="1175" y1="850" x2="1175" y2="900"/>

  <text class="mono" x="99" y="1019">src/agent · src/core/query_engine · src/ingestion · src/mcp_server · src/observability/dashboard · src/libs</text>
</svg>
