name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_production_assets.py
      - run: python -m pytest tests/unit tests/integration -m "not llm and not image"
      - run: python -m compileall -q src scripts
      - run: python -m ruff check src scripts --select F

  public-quality:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    needs: deterministic
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require DeepSeek secret
        shell: pwsh
        run: if (-not $env:DEEPSEEK_API_KEY) { throw 'DEEPSEEK_API_KEY is required' }
      - run: python -m pip install -e ".[dev]"
      - name: Build public-only final answers
        run: python scripts/run_public_quality.py --output artifacts/public-answers.json
      - name: Fixed DeepSeek judge
        run: python scripts/deepseek_public_eval.py --answers artifacts/public-answers.json --output artifacts/current-quality.json
      - name: Enforce frozen gate
        run: python scripts/quality_gate.py --current artifacts/current-quality.json --baseline evaluation/baseline.pending.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-quality
          path: artifacts/
