# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "ollama"
  model: "qwen3:8b"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""
  base_url: "http://127.0.0.1:11434"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "ollama"
  model: "qwen3-embedding:0.6b"
  dimensions: 1024
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "http://localhost:11434"

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true
  provider: "ollama"
  model: "qwen2.5vl:7b"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "http://localhost:11434"
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "qdrant"
  persist_directory: "./data/db/chroma"
  collection_name: "default"
  url: "http://127.0.0.1:6333"
  api_key: ""
  collection_prefix: "modular_rag"
  index_version: "v1"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: true
  provider: "cross_encoder"
  model: "BAAI/bge-reranker-v2-m3"
  top_k: 5
  candidate_top_k: 20
  timeout: 30
  device: "auto"
  # Persistent across EXE upgrades; resolves to %LOCALAPPDATA%\ModularRAG\models\huggingface.
  cache_dir: "user"

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true
  sqlite_path: "./data/db/production.db"
  content_retention_days: 30

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  max_file_size_mb: 100
  allowed_extensions: [".pdf", ".md", ".markdown", ".txt"]
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment

# =============================================================================
# Agent Configuration (Stage J: Agentic RAG Layer)
# =============================================================================
agent:
  max_turns: 5                  # Maximum ReAct loop iterations
  confidence_threshold: 0.7     # Minimum confidence to accept answer without retry
  default_collection: "default" # Default collection for tool searches
  top_k: 5                      # Default top-k for tool retrieval calls

server:
  host: "0.0.0.0"
  port: 8766
  dashboard_port: 8501
  access_token_minutes: 15
  refresh_token_days: 7
  max_query_length: 2000
  upload_max_mb: 100
  rate_limit_per_minute: 60

evidence:
  min_top_score: 0.35
  min_evidence_count: 1
  min_citation_coverage: 0.95
  # Must become "calibrated" only after public/private dev-split threshold calibration.
  calibration_status: "pending"
  calibration_artifact: null

web_crawler:
  max_depth: 1
  max_pages: 20
  max_response_mb: 5
  timeout_seconds: 15
